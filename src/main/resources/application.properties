spring.main.web-application-type=none
spring.main.banner-mode=off

logging.level.root=WARN
logging.level.dev.rafay.fileorganizer=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %msg%n
logging.file.name=organizer.log

# Defaults (override on the command line, e.g. --organizer.source=/path)
organizer.dry-run=false
organizer.deep-archive=false
organizer.archive-after-days=365
# Password for Deep_Archive.zip; read from the ARCHIVE_PASSWORD environment variable if set
organizer.archive-password=${ARCHIVE_PASSWORD:}
